<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#5c6ac4">
  <meta name="description" content="Family Expense Tracker for co-parents">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Expense Tracker">
  <link rel="manifest" href="data:application/json,{%22name%22:%22Family%20Expense%20Tracker%22,%22short_name%22:%22Expenses%22,%22start_url%22:%22/%22,%22display%22:%22standalone%22,%22background_color%22:%22%23ffffff%22,%22theme_color%22:%22%235c6ac4%22,%22icons%22:[{%22src%22:%22data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 192 192%27%3E%3Crect fill=%27%235c6ac4%27 width=%27192%27 height=%27192%27/%3E%3Ctext x=%2750%25%27 y=%2750%25%27 font-size=%2780%27 fill=%27white%27 text-anchor=%27middle%27 dominant-baseline=%27middle%27 font-weight=%27bold%27%3E$%3C/text%3E%3C/svg%3E%22,%22sizes%22:%22192x192%22,%22type%22:%22image/svg+xml%22}]}">
  <title>Family Expense Tracker</title>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; color: #1a1a1a; line-height: 1.6; }
    .container { max-width: 900px; margin: 0 auto; padding: 20px; }
    input, select, textarea { width: 100%; padding: 8px 10px; border: 0.5px solid #d0d0d0; border-radius: 8px; font-size: 13px; box-sizing: border-box; font-family: inherit; margin-bottom: 0; }
    button { padding: 10px 12px; border: 0.5px solid #d0d0d0; border-radius: 8px; font-size: 13px; cursor: pointer; font-weight: 500; background: white; transition: all 0.2s; }
    button:hover { background: #f0f0f0; }
    button.primary { background: #5c6ac4; color: white; border-color: #5c6ac4; }
    button.primary:hover { background: #4c5ab4; }
    button.danger { background: #f5a5a5; color: #8b0000; }
    h2 { font-size: 18px; font-weight: 500; margin-bottom: 8px; }
    h3 { font-size: 13px; font-weight: 500; margin: 12px 0 8px; }
    .card { background: white; border: 0.5px solid #e0e0e0; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .login-form { max-width: 400px; margin: 60px auto; }
    .setup-form { max-width: 500px; margin: 0 auto; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; color: #666; margin-bottom: 6px; }
    .balance-card { background: white; border: 0.5px solid #e0e0e0; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .balance-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 12px; }
    .balance-label { font-size: 13px; color: #666; margin-bottom: 4px; }
    .balance-amount { font-size: 18px; font-weight: 500; }
    .warning-banner { background: #fff3cd; border: 0.5px solid #ffc107; color: #856404; padding: 12px; border-radius: 8px; margin-bottom: 12px; font-size: 12px; font-weight: 500; }
    .success-banner { background: #d4edda; border: 0.5px solid #28a745; color: #155724; padding: 12px; border-radius: 8px; margin-bottom: 12px; font-size: 12px; font-weight: 500; }
    .error { color: #8b0000; font-size: 12px; margin-bottom: 12px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .modal { background: white; border-radius: 12px; padding: 24px; max-width: 500px; width: 90%; max-height: 90vh; overflow-y: auto; }
    .modal-buttons { display: flex; gap: 8px; margin-top: 20px; }
    .modal-buttons button { flex: 1; }
    .children-list { background: #f9f9f9; border: 0.5px solid #e0e0e0; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
    .child-input-group { display: flex; gap: 8px; margin-bottom: 8px; align-items: flex-end; }
    .child-input-group input { flex: 1; margin-bottom: 0; }
    .tabs { display: flex; gap: 8px; margin-bottom: 16px; border-bottom: 0.5px solid #e0e0e0; padding-bottom: 8px; overflow-x: auto; }
    .tab-btn { padding: 8px 12px; background: transparent; border: none; cursor: pointer; font-size: 13px; color: #666; }
    .tab-btn.active { background: white; border: 0.5px solid #ccc; border-radius: 6px; color: #1a1a1a; font-weight: 500; }
    .expense-item { background: white; border: 0.5px solid #e0e0e0; border-radius: 8px; padding: 12px; margin-bottom: 8px; display: flex; gap: 10px; justify-content: space-between; }
    .expense-content { flex: 1; }
    .expense-title { font-weight: 500; font-size: 13px; margin-bottom: 2px; }
    .expense-desc { font-size: 11px; color: #666; margin-bottom: 2px; }
    .expense-date { font-size: 11px; color: #999; }
    .expense-actions { display: flex; gap: 4px; }
    .expense-actions button { padding: 4px 8px; font-size: 11px; }
    .receipt-preview { font-size: 11px; color: #666; margin-top: 6px; padding: 8px; background: #f9f9f9; border-radius: 6px; display: flex; align-items: center; gap: 8px; }
    .receipt-preview a { color: #5c6ac4; text-decoration: none; cursor: pointer; }
    .helper-text { font-size: 11px; color: #999; margin-top: 4px; font-style: italic; }
    .helper-note { font-size: 12px; color: #666; margin-bottom: 12px; font-style: italic; }
    .loading { text-align: center; padding: 40px; }
    .auth-tabs { display: flex; gap: 8px; margin-bottom: 20px; }
    .auth-tab { padding: 10px 16px; background: #f0f0f0; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; }
    .auth-tab.active { background: #5c6ac4; color: white; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyDWmFkPgfQtlsiE3ytsGci4EYpR0fkHMoY",
      authDomain: "family-expense-tracker-d535b.firebaseapp.com",
      projectId: "family-expense-tracker-d535b",
      storageBucket: "family-expense-tracker-d535b.appspot.com",
      messagingSenderId: "337488767089",
      appId: "1:337488767089:web:b95e54d7d6678db2a093d0",
      databaseURL: "https://family-expense-tracker-d535b-default-rtdb.firebaseio.com"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    function App() {
      const [page, setPage] = useState('loading');
      const [authMode, setAuthMode] = useState('login'); // login or signup
      const [familyId, setFamilyId] = useState(null);
      const [user, setUser] = useState(null);
      
      const [expenses, setExpenses] = useState([]);
      const [payments, setPayments] = useState([]);
      const [recurringRules, setRecurringRules] = useState([]);
      
      const [parent1Name, setParent1Name] = useState('');
      const [parent2Name, setParent2Name] = useState('');
      const [parent1Email, setParent1Email] = useState('');
      const [parent2Email, setParent2Email] = useState('');
      const [children, setChildren] = useState(['']);
      
      const [authEmail, setAuthEmail] = useState('');
      const [authPassword, setAuthPassword] = useState('');
      const [authError, setAuthError] = useState('');
      
      const [showSettingsModal, setShowSettingsModal] = useState(false);
      const [activeTab, setActiveTab] = useState('expenses');

      const [formDate, setFormDate] = useState(new Date().toISOString().split('T')[0]);
      const [formAmount, setFormAmount] = useState('');
      const [formCategory, setFormCategory] = useState('activities');
      const [formPaidBy, setFormPaidBy] = useState('');
      const [formNotes, setFormNotes] = useState('');
      const [formReceipt, setFormReceipt] = useState(null);
      const [formReceiptName, setFormReceiptName] = useState('');
      const [formChild, setFormChild] = useState('');
      const [editing, setEditing] = useState(null);

      // Watch auth state
      useEffect(() => {
        const unsubscribe = auth.onAuthStateChanged((currentUser) => {
          if (currentUser) {
            setUser(currentUser);
            // Look up family for this user
            db.ref('families').orderByChild('parent1Email').equalTo(currentUser.email).once('value', (snapshot) => {
              if (snapshot.exists()) {
                const familyKey = Object.keys(snapshot.val())[0];
                setFamilyId(familyKey);
                loadFamilyData(familyKey);
                setPage('dashboard');
              } else {
                // Check if they're parent 2
                db.ref('families').orderByChild('parent2Email').equalTo(currentUser.email).once('value', (snapshot) => {
                  if (snapshot.exists()) {
                    const familyKey = Object.keys(snapshot.val())[0];
                    setFamilyId(familyKey);
                    loadFamilyData(familyKey);
                    setPage('dashboard');
                  } else {
                    // New user - go to setup
                    setPage('setup');
                  }
                });
              }
            });
          } else {
            setUser(null);
            setPage('login');
          }
        });
        return unsubscribe;
      }, []);

      const loadFamilyData = (fId) => {
        const familyRef = db.ref(`families/${fId}`);
        familyRef.on('value', (snapshot) => {
          const data = snapshot.val();
          if (data) {
            setParent1Name(data.parent1Name || '');
            setParent2Name(data.parent2Name || '');
            setParent1Email(data.parent1Email || '');
            setParent2Email(data.parent2Email || '');
            setChildren(Object.values(data.children || {}));
            setExpenses(Object.entries(data.expenses || {}).map(([id, ex]) => ({ ...ex, id })));
            setPayments(Object.entries(data.payments || {}).map(([id, p]) => ({ ...p, id })));
            setRecurringRules(Object.entries(data.recurringRules || {}).map(([id, r]) => ({ ...r, id })));
          }
        });
      };

      const handleLogin = async (e) => {
        e.preventDefault();
        setAuthError('');

        if (!authEmail || !authPassword) {
          setAuthError('Please enter email and password');
          return;
        }

        try {
          await auth.signInWithEmailAndPassword(authEmail, authPassword);
        } catch (error) {
          setAuthError(error.message);
        }
      };

      const handleSignup = async (e) => {
        e.preventDefault();
        setAuthError('');

        if (!authEmail || !authPassword) {
          setAuthError('Please enter email and password');
          return;
        }

        try {
          await auth.createUserWithEmailAndPassword(authEmail, authPassword);
        } catch (error) {
          setAuthError(error.message);
        }
      };

      const handleSetupSubmit = async (e) => {
        e.preventDefault();
        
        if (!parent1Name || !parent2Name || !parent2Email || !children.filter(c => c.trim()).length) {
          alert('Please fill in all required fields');
          return;
        }

        const cleanChildren = children.filter(c => c.trim());
        setChildren(cleanChildren);
        
        const newFamilyId = Math.random().toString(36).substr(2, 9);
        
        db.ref(`families/${newFamilyId}`).set({
          parent1Name,
          parent2Name,
          parent1Email: user.email,
          parent2Email,
          children: cleanChildren,
          expenses: {},
          payments: {},
          recurringRules: {}
        });

        setFamilyId(newFamilyId);
        setPage('dashboard');
      };

      const handleAddExpense = async (e) => {
        e.preventDefault();
        if (!formAmount || !formPaidBy || !formChild) return;

        const expenseId = editing || Date.now().toString();
        const expense = {
          date: formDate,
          category: formCategory,
          amount: parseFloat(formAmount),
          paidBy: formPaidBy,
          notes: formNotes,
          receiptData: formReceipt,
          receiptName: formReceiptName,
          child: formChild,
          addedBy: user.email,
          addedAt: new Date().toISOString()
        };

        db.ref(`families/${familyId}/expenses/${expenseId}`).set(expense);
        resetForm();
      };

      const resetForm = () => {
        setFormDate(new Date().toISOString().split('T')[0]);
        setFormAmount('');
        setFormCategory('activities');
        setFormPaidBy('');
        setFormNotes('');
        setFormReceipt(null);
        setFormReceiptName('');
        setFormChild('');
        setEditing(null);
      };

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => {
            setFormReceipt(event.target.result);
            setFormReceiptName(file.name);
          };
          reader.readAsDataURL(file);
        }
      };

      const handleDeleteExpense = (id) => {
        db.ref(`families/${familyId}/expenses/${id}`).remove();
      };

      const handleLogout = async () => {
        await auth.signOut();
      };

      const totalPaidByParent1 = expenses.filter(ex => ex.paidBy === parent1Name).reduce((sum, ex) => sum + ex.amount, 0);
      const totalPaidByParent2 = expenses.filter(ex => ex.paidBy === parent2Name).reduce((sum, ex) => sum + ex.amount, 0);
      const difference = totalPaidByParent1 - totalPaidByParent2;

      let debtorName = '';
      let debtAmount = 0;
      if (Math.abs(difference) > 0.01) {
        debtorName = difference > 0 ? parent2Name : parent1Name;
        debtAmount = Math.abs(difference) / 2;
      }

      const categoryEmoji = { school: '🎓', medical: '🏥', activities: '⚽', gifts: '🎁' };
      const currentName = user && user.email === parent1Email ? parent1Name : parent2Name;

      if (page === 'loading') {
        return <div className="loading"><h2>Loading...</h2></div>;
      }

      if (page === 'login') {
        return (
          <div className="login-form">
            <h2>Family Expense Tracker</h2>
            
            <div className="auth-tabs">
              <button className={`auth-tab ${authMode === 'login' ? 'active' : ''}`} onClick={() => { setAuthMode('login'); setAuthError(''); }}>Login</button>
              <button className={`auth-tab ${authMode === 'signup' ? 'active' : ''}`} onClick={() => { setAuthMode('signup'); setAuthError(''); }}>Sign Up</button>
            </div>

            <form onSubmit={authMode === 'login' ? handleLogin : handleSignup}>
              <div className="form-group">
                <label>Email</label>
                <input 
                  type="email" 
                  value={authEmail} 
                  onChange={(e) => setAuthEmail(e.target.value)}
                  placeholder="your@email.com"
                  autoFocus
                />
              </div>
              <div className="form-group">
                <label>Password</label>
                <input 
                  type="password" 
                  value={authPassword} 
                  onChange={(e) => setAuthPassword(e.target.value)}
                  placeholder="••••••••"
                />
              </div>
              {authError && <div className="error">{authError}</div>}
              <button type="submit" className="primary" style={{ width: '100%' }}>{authMode === 'login' ? 'Login' : 'Sign Up'}</button>
            </form>
          </div>
        );
      }

      if (page === 'setup') {
        return (
          <div className="container">
            <div className="setup-form">
              <h2>Complete setup</h2>
              <p style={{ fontSize: '13px', color: '#666', marginBottom: '16px' }}>Setting up for {user?.email}</p>
              
              <h3>Parent 1 (You)</h3>
              <div className="form-group">
                <label>Name</label>
                <input type="text" value={parent1Name} onChange={(e) => setParent1Name(e.target.value)} placeholder="e.g., Sarah" />
              </div>

              <h3>Parent 2</h3>
              <div className="form-group">
                <label>Name</label>
                <input type="text" value={parent2Name} onChange={(e) => setParent2Name(e.target.value)} placeholder="e.g., James" />
              </div>
              <div className="form-group">
                <label>Email</label>
                <input type="email" value={parent2Email} onChange={(e) => setParent2Email(e.target.value)} placeholder="parent2@email.com" />
              </div>

              <h3>Children</h3>
              <div className="children-list">
                {children.map((child, i) => (
                  <div key={i} className="child-input-group">
                    <input 
                      type="text" 
                      value={child} 
                      onChange={(e) => { const u = [...children]; u[i] = e.target.value; setChildren(u); }}
                      placeholder={`Child ${i + 1}`}
                    />
                    {children.length > 1 && (
                      <button className="danger" type="button" onClick={() => setChildren(children.filter((_, idx) => idx !== i))}>Remove</button>
                    )}
                  </div>
                ))}
                {children.length < 4 && (
                  <button type="button" onClick={() => setChildren([...children, ''])}>+ Add Child</button>
                )}
              </div>

              <button className="primary" onClick={handleSetupSubmit} style={{ width: '100%', marginTop: '20px' }}>Complete Setup</button>
            </div>
          </div>
        );
      }

      if (page === 'dashboard') {
        return (
          <div className="container">
            <div className="top-bar">
              <div>
                <h2>Family Expense Tracker</h2>
                <p style={{ fontSize: '12px', color: '#666', margin: '4px 0 0 0' }}>Welcome, {currentName}</p>
              </div>
              <div>
                <button onClick={() => setShowSettingsModal(true)}>Edit</button>
                <button onClick={handleLogout} style={{ marginLeft: '8px' }}>Logout</button>
              </div>
            </div>

            <div className="tabs">
              <button className={`tab-btn ${activeTab === 'expenses' ? 'active' : ''}`} onClick={() => setActiveTab('expenses')}>Expenses</button>
              <button className={`tab-btn ${activeTab === 'recurring' ? 'active' : ''}`} onClick={() => setActiveTab('recurring')}>Recurring</button>
              <button className={`tab-btn ${activeTab === 'payments' ? 'active' : ''}`} onClick={() => setActiveTab('payments')}>Payments</button>
            </div>

            {activeTab === 'expenses' && (
              <>
                {expenses.length > 0 && (
                  <div className="balance-card">
                    <div className="balance-row">
                      <div>
                        <div className="balance-label">{parent1Name} paid</div>
                        <div className="balance-amount">${totalPaidByParent1.toFixed(2)}</div>
                      </div>
                      <div>
                        <div className="balance-label">{parent2Name} paid</div>
                        <div className="balance-amount">${totalPaidByParent2.toFixed(2)}</div>
                      </div>
                    </div>
                    {debtAmount > 0.01 ? (
                      <div className="warning-banner">{debtorName} owes ${debtAmount.toFixed(2)}</div>
                    ) : (
                      <div className="success-banner">✓ All settled up!</div>
                    )}
                  </div>
                )}

                <div className="card">
                  <h3>Add one-time expense</h3>
                  <form onSubmit={handleAddExpense}>
                    <div className="grid-2">
                      <div className="form-group">
                        <label>Date</label>
                        <input type="date" value={formDate} onChange={(e) => setFormDate(e.target.value)} />
                      </div>
                      <div className="form-group">
                        <label>Child</label>
                        <select value={formChild} onChange={(e) => setFormChild(e.target.value)}>
                          <option value="">Select child</option>
                          {children.map((child, i) => <option key={i} value={child}>{child}</option>)}
                        </select>
                      </div>
                    </div>

                    <div className="grid-2">
                      <div className="form-group">
                        <label>Category</label>
                        <select value={formCategory} onChange={(e) => setFormCategory(e.target.value)}>
                          <option value="school">🎓 School</option>
                          <option value="medical">🏥 Medical</option>
                          <option value="activities">⚽ Activities</option>
                          <option value="gifts">🎁 Gifts</option>
                        </select>
                      </div>
                      <div className="form-group">
                        <label>Amount</label>
                        <input type="number" step="0.01" min="0" value={formAmount} onChange={(e) => setFormAmount(e.target.value)} placeholder="0.00" />
                        <div className="helper-text">Input the total amount paid and we will calculate the total amount your co-parent owes</div>
                      </div>
                    </div>

                    <div className="form-group">
                      <label>Paid by</label>
                      <select value={formPaidBy} onChange={(e) => setFormPaidBy(e.target.value)}>
                        <option value="">Select parent</option>
                        <option value={parent1Name}>{parent1Name}</option>
                        <option value={parent2Name}>{parent2Name}</option>
                      </select>
                    </div>

                    <div className="form-group">
                      <label>Notes (optional)</label>
                      <textarea value={formNotes} onChange={(e) => setFormNotes(e.target.value)} placeholder="e.g., Soccer registration" style={{ minHeight: '50px' }} />
                    </div>

                    <div className="form-group">
                      <label>Receipt (optional)</label>
                      <input type="file" accept="image/*,.pdf" onChange={handleFileUpload} />
                      {formReceiptName && (
                        <div className="receipt-preview">
                          📎 {formReceiptName}
                          <button type="button" onClick={() => { setFormReceipt(null); setFormReceiptName(''); }} style={{ padding: '2px 6px', fontSize: '11px', background: 'transparent', border: 'none', color: '#999', cursor: 'pointer' }}>Remove</button>
                        </div>
                      )}
                    </div>

                    <button type="submit" className="primary" style={{ width: '100%' }}>{editing ? 'Update' : 'Add expense'}</button>
                  </form>
                </div>

                <h3>All expenses</h3>
                {expenses.length === 0 ? (
                  <p style={{ color: '#999' }}>No expenses yet</p>
                ) : (
                  expenses.map(ex => (
                    <div key={ex.id} className="expense-item">
                      <div className="expense-content">
                        <div className="expense-title">{categoryEmoji[ex.category]} ${ex.amount.toFixed(2)} • {ex.paidBy} • {ex.child}</div>
                        {ex.notes && <div className="expense-desc">{ex.notes}</div>}
                        {ex.receiptName && (
                          <div className="receipt-preview">
                            📎 <a onClick={() => { const link = document.createElement('a'); link.href = ex.receiptData; link.download = ex.receiptName; link.click(); }}>Download receipt</a>
                          </div>
                        )}
                        <div className="expense-date">{new Date(ex.date).toLocaleDateString()}</div>
                      </div>
                      <div className="expense-actions">
                        <button onClick={() => { setEditing(ex.id); setFormDate(ex.date); setFormAmount(ex.amount.toString()); setFormCategory(ex.category); setFormPaidBy(ex.paidBy); setFormNotes(ex.notes); setFormReceipt(ex.receiptData); setFormReceiptName(ex.receiptName); setFormChild(ex.child); }}>Edit</button>
                        <button className="danger" onClick={() => handleDeleteExpense(ex.id)}>Delete</button>
                      </div>
                    </div>
                  ))
                )}
              </>
            )}

            {activeTab === 'recurring' && (
              <div className="card">
                <h3>Recurring expenses</h3>
                <p style={{ color: '#999', fontSize: '13px' }}>Coming in Phase 2</p>
              </div>
            )}

            {activeTab === 'payments' && (
              <div className="card">
                <h3>Payments</h3>
                <p style={{ color: '#999', fontSize: '13px' }}>Coming in Phase 2</p>
              </div>
            )}

            {showSettingsModal && (
              <div className="modal-overlay">
                <div className="modal">
                  <h2>Settings</h2>
                  
                  <h3>Parent 1</h3>
                  <div className="form-group">
                    <label>Name</label>
                    <input type="text" value={parent1Name} onChange={(e) => setParent1Name(e.target.value)} />
                  </div>

                  <h3>Parent 2</h3>
                  <div className="form-group">
                    <label>Name</label>
                    <input type="text" value={parent2Name} onChange={(e) => setParent2Name(e.target.value)} />
                  </div>

                  <h3>Children</h3>
                  <p className="helper-note">Edit your children's names. Note: This feature will override for both parents accounts.</p>
                  <div className="children-list">
                    {children.map((child, i) => (
                      <div key={i} className="child-input-group">
                        <input 
                          type="text" 
                          value={child} 
                          onChange={(e) => { const u = [...children]; u[i] = e.target.value; setChildren(u); }}
                          placeholder={`Child ${i + 1}`}
                        />
                        {children.length > 1 && (
                          <button className="danger" onClick={() => setChildren(children.filter((_, idx) => idx !== i))}>Remove</button>
                        )}
                      </div>
                    ))}
                    {children.length < 4 && (
                      <button onClick={() => setChildren([...children, ''])}>+ Add Child</button>
                    )}
                  </div>

                  <div className="modal-buttons">
                    <button onClick={() => setShowSettingsModal(false)}>Cancel</button>
                    <button className="primary" onClick={() => { 
                      db.ref(`families/${familyId}`).update({
                        parent1Name,
                        parent2Name,
                        children: children.filter(c => c.trim())
                      });
                      setShowSettingsModal(false); 
                    }}>Save</button>
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      }

      return <div className="container"><h2>Loading...</h2></div>;
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      const swCode = `
        self.addEventListener('install', (e) => self.skipWaiting());
        self.addEventListener('activate', (e) => e.waitUntil(clients.claim()));
        self.addEventListener('fetch', (e) => {
          if (e.request.method === 'GET') {
            e.respondWith(
              caches.match(e.request).then((response) => response || fetch(e.request))
              .catch(() => new Response('Offline'))
            );
          }
        });
      `;
      const blob = new Blob([swCode], { type: 'application/javascript' });
      const swUrl = URL.createObjectURL(blob);
      navigator.serviceWorker.register(swUrl).catch(() => {});
    }
  </script>
</body>
</html>
