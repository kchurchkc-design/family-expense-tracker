<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Expense Tracker</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      background: #f5f5f5;
      color: #1a1a1a;
      line-height: 1.6;
    }
    .container { max-width: 900px; margin: 0 auto; padding: 20px; }
    input, select, textarea, button { font-family: inherit; }
    input, select, textarea {
      width: 100%;
      padding: 8px 10px;
      border: 0.5px solid #d0d0d0;
      border-radius: 8px;
      font-size: 13px;
      box-sizing: border-box;
    }
    textarea { min-height: 60px; resize: vertical; }
    button {
      padding: 10px 12px;
      border: 0.5px solid #d0d0d0;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      font-weight: 500;
      background: white;
      transition: all 0.2s;
    }
    button:hover { background: #f0f0f0; }
    button.primary {
      background: #5c6ac4;
      color: white;
      border-color: #5c6ac4;
    }
    button.primary:hover { background: #4c5ab4; }
    button.danger {
      background: #f5a5a5;
      color: #8b0000;
      border-color: #f5a5a5;
    }
    button.success {
      background: #a5d5a5;
      color: #004d00;
      border-color: #a5d5a5;
    }
    h2 { font-size: 18px; font-weight: 500; margin-bottom: 8px; }
    h3 { font-size: 13px; font-weight: 500; margin: 12px 0 8px; }
    .card {
      background: white;
      border: 0.5px solid #e0e0e0;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      border-bottom: 0.5px solid #e0e0e0;
      padding-bottom: 8px;
      overflow-x: auto;
    }
    .tab-btn {
      padding: 8px 12px;
      background: transparent;
      border: 0.5px solid transparent;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
      color: #666;
    }
    .tab-btn.active {
      background: white;
      border-color: #ccc;
      color: #1a1a1a;
      font-weight: 500;
    }
    .balance-card {
      background: white;
      border: 0.5px solid #e0e0e0;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .balance-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 12px; }
    .balance-item { }
    .balance-label { font-size: 13px; color: #666; margin-bottom: 4px; }
    .balance-amount { font-size: 18px; font-weight: 500; }
    .warning-banner {
      background: #fff3cd;
      border: 0.5px solid #ffc107;
      color: #856404;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 12px;
      font-size: 12px;
      font-weight: 500;
    }
    .success-banner {
      background: #d4edda;
      border: 0.5px solid #28a745;
      color: #155724;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 12px;
      font-size: 12px;
      font-weight: 500;
    }
    .expense-item {
      background: white;
      border: 0.5px solid #e0e0e0;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 8px;
      display: flex;
      gap: 10px;
      align-items: flex-start;
      justify-content: space-between;
    }
    .expense-content { flex: 1; }
    .expense-title { font-weight: 500; font-size: 13px; margin-bottom: 2px; }
    .expense-desc { font-size: 11px; color: #666; margin-bottom: 2px; }
    .expense-date { font-size: 11px; color: #999; }
    .expense-actions {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }
    .expense-actions button { padding: 4px 8px; font-size: 11px; }
    .setup-form { max-width: 500px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; color: #666; margin-bottom: 6px; }
    .user-badge { font-size: 12px; color: #666; margin-bottom: 16px; }
    .user-badge button { background: none; border: none; color: #5c6ac4; text-decoration: underline; padding: 0; margin-left: 8px; cursor: pointer; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [expenses, setExpenses] = useState([]);
      const [recurringRules, setRecurringRules] = useState([]);
      const [payments, setPayments] = useState([]);
      const [parent1Name, setParent1Name] = useState('Parent 1');
      const [parent2Name, setParent2Name] = useState('Parent 2');
      const [parent1Email, setParent1Email] = useState('');
      const [parent2Email, setParent2Email] = useState('');
      const [child1Name, setChild1Name] = useState('Child 1');
      const [child2Name, setChild2Name] = useState('Child 2');
      const [currentUser, setCurrentUser] = useState('');
      const [setupMode, setSetupMode] = useState(true);
      const [activeTab, setActiveTab] = useState('expenses');

      const [formDate, setFormDate] = useState(new Date().toISOString().split('T')[0]);
      const [formAmount, setFormAmount] = useState('');
      const [formCategory, setFormCategory] = useState('activities');
      const [formPaidBy, setFormPaidBy] = useState('');
      const [formDescription, setFormDescription] = useState('');
      const [formChild, setFormChild] = useState('');
      const [formNotes, setFormNotes] = useState('');
      const [formReceiptUrl, setFormReceiptUrl] = useState('');
      const [editing, setEditing] = useState(null);

      const [recurringAmount, setRecurringAmount] = useState('');
      const [recurringCategory, setRecurringCategory] = useState('activities');
      const [recurringPaidBy, setRecurringPaidBy] = useState('');
      const [recurringChild, setRecurringChild] = useState('');
      const [recurringDescription, setRecurringDescription] = useState('');
      const [recurringFrequency, setRecurringFrequency] = useState('monthly');
      const [recurringStartDate, setRecurringStartDate] = useState(new Date().toISOString().split('T')[0]);
      const [editingRecurring, setEditingRecurring] = useState(null);

      useEffect(() => {
        const loadData = async () => {
          try {
            const stored = localStorage.getItem('coparenting:enhanced');
            if (stored) {
              const data = JSON.parse(stored);
              setExpenses(data.expenses || []);
              setPayments(data.payments || []);
              setRecurringRules(data.recurringRules || []);
              setParent1Name(data.parent1Name || 'Parent 1');
              setParent2Name(data.parent2Name || 'Parent 2');
              setParent1Email(data.parent1Email || '');
              setParent2Email(data.parent2Email || '');
              setChild1Name(data.child1Name || 'Child 1');
              setChild2Name(data.child2Name || 'Child 2');
              if (!currentUser && data.parent1Email) {
                setCurrentUser(data.parent1Email);
                setSetupMode(false);
              }
            }
          } catch (err) {
            console.log('First load');
          }
        };
        loadData();
      }, []);

      useEffect(() => {
        if (expenses.length > 0 || recurringRules.length > 0) {
          generateRecurringExpenses();
        }
      }, [recurringRules]);

      const generateRecurringExpenses = () => {
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const todayStr = today.toISOString().split('T')[0];

        let newExpenses = [...expenses];
        let anyGenerated = false;

        recurringRules.forEach(rule => {
          if (!rule.active) return;

          const lastGenerated = rule.lastGenerated ? new Date(rule.lastGenerated) : null;
          if (lastGenerated) lastGenerated.setHours(0, 0, 0, 0);

          let shouldGenerate = false;
          const startDate = new Date(rule.startDate);
          startDate.setHours(0, 0, 0, 0);

          if (today >= startDate) {
            if (!lastGenerated || lastGenerated < today) {
              if (rule.frequency === 'daily') {
                shouldGenerate = true;
              } else if (rule.frequency === 'weekly') {
                const daysDiff = Math.floor((today - startDate) / (1000 * 60 * 60 * 24));
                shouldGenerate = daysDiff % 7 === 0;
              } else if (rule.frequency === 'monthly') {
                shouldGenerate = today.getDate() === startDate.getDate();
              } else if (rule.frequency === 'yearly') {
                shouldGenerate = today.getMonth() === startDate.getMonth() && today.getDate() === startDate.getDate();
              }
            }
          }

          if (shouldGenerate) {
            const newExpense = {
              id: `${rule.id}-${todayStr}`,
              date: todayStr,
              category: rule.category,
              amount: rule.amount,
              paidBy: rule.paidBy,
              description: rule.description,
              child: rule.child,
              notes: `Auto-generated from recurring rule`,
              receiptUrl: '',
              addedBy: currentUser || rule.createdBy,
              addedAt: new Date().toISOString(),
              recurringRuleId: rule.id
            };

            const exists = newExpenses.some(ex => ex.id === newExpense.id);
            if (!exists) {
              newExpenses.push(newExpense);
              anyGenerated = true;
            }
          }
        });

        if (anyGenerated) {
          newExpenses.sort((a, b) => new Date(b.date) - new Date(a.date));
          setExpenses(newExpenses);
          saveData(newExpenses, recurringRules);
        }
      };

      const saveData = async (updatedExpenses, updatedRecurring) => {
        try {
          localStorage.setItem('coparenting:enhanced', JSON.stringify({
            expenses: updatedExpenses,
            payments,
            recurringRules: updatedRecurring || recurringRules,
            parent1Name,
            parent2Name,
            parent1Email,
            parent2Email,
            child1Name,
            child2Name,
            lastUpdated: new Date().toISOString()
          }));
        } catch (err) {
          console.error('Storage error:', err);
        }
      };

      const handleSetupComplete = () => {
        if (!parent1Name || !parent2Name || !parent1Email || !parent2Email || !child1Name || !child2Name) {
          alert('Please fill in all fields');
          return;
        }
        setCurrentUser(parent1Email);
        setSetupMode(false);
        saveData([], []);
      };

      const handleAddExpense = (e) => {
        e.preventDefault();
        if (!formAmount || !formPaidBy || !formChild) return;

        const newExpense = {
          id: editing || Date.now(),
          date: formDate,
          category: formCategory,
          amount: parseFloat(formAmount),
          paidBy: formPaidBy,
          description: formDescription,
          child: formChild,
          notes: formNotes,
          receiptUrl: formReceiptUrl,
          addedBy: currentUser,
          addedAt: new Date().toISOString()
        };

        const updated = editing
          ? expenses.map(ex => ex.id === editing ? newExpense : ex)
          : [...expenses, newExpense];

        updated.sort((a, b) => new Date(b.date) - new Date(a.date));
        setExpenses(updated);
        saveData(updated, recurringRules);
        resetForm();
      };

      const handleAddRecurring = (e) => {
        e.preventDefault();
        if (!recurringAmount || !recurringPaidBy || !recurringChild) return;

        const newRule = {
          id: editingRecurring || `rule-${Date.now()}`,
          amount: parseFloat(recurringAmount),
          category: recurringCategory,
          paidBy: recurringPaidBy,
          child: recurringChild,
          description: recurringDescription,
          frequency: recurringFrequency,
          startDate: recurringStartDate,
          active: true,
          lastGenerated: null,
          createdBy: currentUser,
          createdAt: new Date().toISOString()
        };

        const updated = editingRecurring
          ? recurringRules.map(r => r.id === editingRecurring ? newRule : r)
          : [...recurringRules, newRule];

        setRecurringRules(updated);
        saveData(expenses, updated);
        resetRecurringForm();
      };

      const handleToggleRecurring = (ruleId) => {
        const updated = recurringRules.map(r =>
          r.id === ruleId ? { ...r, active: !r.active } : r
        );
        setRecurringRules(updated);
        saveData(expenses, updated);
      };

      const handleDeleteRecurring = (ruleId) => {
        const updated = recurringRules.filter(r => r.id !== ruleId);
        setRecurringRules(updated);
        saveData(expenses, updated);
      };

      const handleDeleteExpense = (id) => {
        const updated = expenses.filter(ex => ex.id !== id);
        setExpenses(updated);
        saveData(updated, recurringRules);
      };

      const resetForm = () => {
        setFormDate(new Date().toISOString().split('T')[0]);
        setFormAmount('');
        setFormCategory('activities');
        setFormPaidBy('');
        setFormDescription('');
        setFormChild('');
        setFormNotes('');
        setFormReceiptUrl('');
        setEditing(null);
      };

      const resetRecurringForm = () => {
        setRecurringAmount('');
        setRecurringCategory('activities');
        setRecurringPaidBy('');
        setRecurringChild('');
        setRecurringDescription('');
        setRecurringFrequency('monthly');
        setRecurringStartDate(new Date().toISOString().split('T')[0]);
        setEditingRecurring(null);
      };

      const totalPaidByParent1 = expenses.filter(ex => ex.paidBy === parent1Name).reduce((sum, ex) => sum + ex.amount, 0);
      const totalPaidByParent2 = expenses.filter(ex => ex.paidBy === parent2Name).reduce((sum, ex) => sum + ex.amount, 0);
      const difference = totalPaidByParent1 - totalPaidByParent2;
      
      let debtorName = '';
      let debtAmount = 0;
      if (Math.abs(difference) > 0.01) {
        if (difference > 0) {
          debtorName = parent2Name;
          debtAmount = Math.abs(difference) / 2;
        } else {
          debtorName = parent1Name;
          debtAmount = Math.abs(difference) / 2;
        }
      }

      const recordPayment = () => {
        const newPayment = {
          id: Date.now(),
          from: debtorName,
          to: debtorName === parent1Name ? parent2Name : parent1Name,
          amount: debtAmount,
          status: 'completed',
          method: 'paypal',
          createdAt: new Date().toISOString()
        };
        setPayments([...payments, newPayment]);
        saveData(expenses, recurringRules);
      };

      const categoryEmoji = { school: '🎓', medical: '🏥', activities: '⚽' };

      if (setupMode) {
        return (
          <div className="container">
            <div className="setup-form">
              <h2>Set up family expense tracker</h2>
              
              <h3>Parents</h3>
              <div className="form-group">
                <label>Parent 1 name</label>
                <input type="text" value={parent1Name} onChange={(e) => setParent1Name(e.target.value)} placeholder="e.g., Sarah" />
              </div>
              <div className="form-group">
                <label>Parent 1 email</label>
                <input type="email" value={parent1Email} onChange={(e) => setParent1Email(e.target.value)} placeholder="sarah@example.com" />
              </div>

              <div className="form-group">
                <label>Parent 2 name</label>
                <input type="text" value={parent2Name} onChange={(e) => setParent2Name(e.target.value)} placeholder="e.g., James" />
              </div>
              <div className="form-group">
                <label>Parent 2 email</label>
                <input type="email" value={parent2Email} onChange={(e) => setParent2Email(e.target.value)} placeholder="james@example.com" />
              </div>

              <h3>Children</h3>
              <div className="form-group">
                <label>Child 1 name</label>
                <input type="text" value={child1Name} onChange={(e) => setChild1Name(e.target.value)} placeholder="e.g., Emma" />
              </div>
              <div className="form-group">
                <label>Child 2 name</label>
                <input type="text" value={child2Name} onChange={(e) => setChild2Name(e.target.value)} placeholder="e.g., Lucas" />
              </div>

              <button className="primary" onClick={handleSetupComplete} style={{ width: '100%' }}>Start tracking</button>
            </div>
          </div>
        );
      }

      return (
        <div className="container">
          <h2>Family Expense Tracker</h2>
          <div className="user-badge">
            {currentUser === parent1Email ? parent1Name : parent2Name}
            <button onClick={() => setCurrentUser(currentUser === parent1Email ? parent2Email : parent1Email)}>Switch</button>
          </div>

          <div className="tabs">
            {['expenses', 'recurring', 'payments'].map(tab => (
              <button
                key={tab}
                className={`tab-btn ${activeTab === tab ? 'active' : ''}`}
                onClick={() => setActiveTab(tab)}
              >
                {tab.charAt(0).toUpperCase() + tab.slice(1)}
              </button>
            ))}
          </div>

          {activeTab === 'expenses' && (
            <>
              {expenses.length > 0 && (
                <div className="balance-card">
                  <div className="balance-row">
                    <div className="balance-item">
                      <div className="balance-label">{parent1Name} paid</div>
                      <div className="balance-amount">${totalPaidByParent1.toFixed(2)}</div>
                    </div>
                    <div className="balance-item">
                      <div className="balance-label">{parent2Name} paid</div>
                      <div className="balance-amount">${totalPaidByParent2.toFixed(2)}</div>
                    </div>
                  </div>
                  {debtAmount > 0.01 ? (
                    <div className="warning-banner">{debtorName} owes ${debtAmount.toFixed(2)}</div>
                  ) : (
                    <div className="success-banner">✓ All settled up!</div>
                  )}
                </div>
              )}

              <div className="card">
                <h3>Add one-time expense</h3>
                <form onSubmit={handleAddExpense}>
                  <div className="grid-2">
                    <div className="form-group">
                      <label>Date</label>
                      <input type="date" value={formDate} onChange={(e) => setFormDate(e.target.value)} />
                    </div>
                    <div className="form-group">
                      <label>Child</label>
                      <select value={formChild} onChange={(e) => setFormChild(e.target.value)}>
                        <option value="">Select child</option>
                        <option value={child1Name}>{child1Name}</option>
                        <option value={child2Name}>{child2Name}</option>
                      </select>
                    </div>
                  </div>

                  <div className="grid-2">
                    <div className="form-group">
                      <label>Category</label>
                      <select value={formCategory} onChange={(e) => setFormCategory(e.target.value)}>
                        <option value="school">🎓 School</option>
                        <option value="medical">🏥 Medical</option>
                        <option value="activities">⚽ Activities</option>
                      </select>
                    </div>
                    <div className="form-group">
                      <label>Amount</label>
                      <input type="number" step="0.01" min="0" value={formAmount} onChange={(e) => setFormAmount(e.target.value)} placeholder="0.00" />
                    </div>
                  </div>

                  <div className="form-group">
                    <label>Paid by</label>
                    <select value={formPaidBy} onChange={(e) => setFormPaidBy(e.target.value)}>
                      <option value="">Select parent</option>
                      <option value={parent1Name}>{parent1Name}</option>
                      <option value={parent2Name}>{parent2Name}</option>
                    </select>
                  </div>

                  <div className="form-group">
                    <label>Description (optional)</label>
                    <input type="text" value={formDescription} onChange={(e) => setFormDescription(e.target.value)} placeholder="e.g., Soccer registration" />
                  </div>

                  <div className="form-group">
                    <label>Notes</label>
                    <textarea value={formNotes} onChange={(e) => setFormNotes(e.target.value)} placeholder="Additional notes..." />
                  </div>

                  <div className="form-group">
                    <label>Receipt URL (optional)</label>
                    <input type="url" value={formReceiptUrl} onChange={(e) => setFormReceiptUrl(e.target.value)} placeholder="https://..." />
                  </div>

                  <button type="submit" className="primary" style={{ width: '100%' }}>{editing ? 'Update' : 'Add expense'}</button>
                </form>
              </div>

              <h3>All expenses</h3>
              {expenses.length === 0 ? (
                <p style={{ color: '#999' }}>No expenses yet</p>
              ) : (
                expenses.map(ex => (
                  <div key={ex.id} className="expense-item">
                    <div className="expense-content">
                      <div className="expense-title">{categoryEmoji[ex.category]} ${ex.amount.toFixed(2)} • {ex.paidBy} • {ex.child}</div>
                      {ex.description && <div className="expense-desc">{ex.description}</div>}
                      {ex.notes && ex.notes !== 'Auto-generated from recurring rule' && <div className="expense-desc">Note: {ex.notes}</div>}
                      {ex.notes === 'Auto-generated from recurring rule' && <div className="expense-desc" style={{ fontStyle: 'italic' }}>Auto-recurring</div>}
                      <div className="expense-date">{new Date(ex.date).toLocaleDateString()}</div>
                    </div>
                    <div className="expense-actions">
                      <button onClick={() => { setEditing(ex.id); setFormDate(ex.date); setFormAmount(ex.amount.toString()); setFormCategory(ex.category); setFormPaidBy(ex.paidBy); setFormDescription(ex.description); setFormChild(ex.child); setFormNotes(ex.notes); setFormReceiptUrl(ex.receiptUrl); }}>Edit</button>
                      <button className="danger" onClick={() => handleDeleteExpense(ex.id)}>Delete</button>
                    </div>
                  </div>
                ))
              )}
            </>
          )}

          {activeTab === 'recurring' && (
            <>
              <div className="card">
                <h3>Create recurring expense</h3>
                <form onSubmit={handleAddRecurring}>
                  <div className="grid-2">
                    <div className="form-group">
                      <label>Amount</label>
                      <input type="number" step="0.01" min="0" value={recurringAmount} onChange={(e) => setRecurringAmount(e.target.value)} placeholder="0.00" />
                    </div>
                    <div className="form-group">
                      <label>Frequency</label>
                      <select value={recurringFrequency} onChange={(e) => setRecurringFrequency(e.target.value)}>
                        <option value="daily">Daily</option>
                        <option value="weekly">Weekly</option>
                        <option value="monthly">Monthly</option>
                        <option value="yearly">Yearly</option>
                      </select>
                    </div>
                  </div>

                  <div className="grid-2">
                    <div className="form-group">
                      <label>Start date</label>
                      <input type="date" value={recurringStartDate} onChange={(e) => setRecurringStartDate(e.target.value)} />
                    </div>
                    <div className="form-group">
                      <label>Child</label>
                      <select value={recurringChild} onChange={(e) => setRecurringChild(e.target.value)}>
                        <option value="">Select child</option>
                        <option value={child1Name}>{child1Name}</option>
                        <option value={child2Name}>{child2Name}</option>
                      </select>
                    </div>
                  </div>

                  <div className="grid-2">
                    <div className="form-group">
                      <label>Category</label>
                      <select value={recurringCategory} onChange={(e) => setRecurringCategory(e.target.value)}>
                        <option value="school">🎓 School</option>
                        <option value="medical">🏥 Medical</option>
                        <option value="activities">⚽ Activities</option>
                      </select>
                    </div>
                    <div className="form-group">
                      <label>Paid by</label>
                      <select value={recurringPaidBy} onChange={(e) => setRecurringPaidBy(e.target.value)}>
                        <option value="">Select parent</option>
                        <option value={parent1Name}>{parent1Name}</option>
                        <option value={parent2Name}>{parent2Name}</option>
                      </select>
                    </div>
                  </div>

                  <div className="form-group">
                    <label>Description (optional)</label>
                    <input type="text" value={recurringDescription} onChange={(e) => setRecurringDescription(e.target.value)} placeholder="e.g., Monthly piano lessons" />
                  </div>

                  <button type="submit" className="primary" style={{ width: '100%' }}>{editingRecurring ? 'Update rule' : 'Create rule'}</button>
                </form>
              </div>

              <h3>Active rules</h3>
              {recurringRules.length === 0 ? (
                <p style={{ color: '#999' }}>No recurring rules yet</p>
              ) : (
                recurringRules.map(rule => (
                  <div key={rule.id} className="expense-item">
                    <div className="expense-content">
                      <div className="expense-title">{categoryEmoji[rule.category]} ${rule.amount.toFixed(2)} {rule.frequency} • {rule.paidBy} • {rule.child}</div>
                      {rule.description && <div className="expense-desc">{rule.description}</div>}
                      <div className="expense-date">Starts {new Date(rule.startDate).toLocaleDateString()}</div>
                    </div>
                    <div className="expense-actions">
                      <button className={rule.active ? 'success' : ''} onClick={() => handleToggleRecurring(rule.id)}>{rule.active ? 'Pause' : 'Resume'}</button>
                      <button onClick={() => { setEditingRecurring(rule.id); setRecurringAmount(rule.amount.toString()); setRecurringCategory(rule.category); setRecurringPaidBy(rule.paidBy); setRecurringChild(rule.child); setRecurringDescription(rule.description); setRecurringFrequency(rule.frequency); setRecurringStartDate(rule.startDate); }}>Edit</button>
                      <button className="danger" onClick={() => handleDeleteRecurring(rule.id)}>Delete</button>
                    </div>
                  </div>
                ))
              )}
            </>
          )}

          {activeTab === 'payments' && (
            <>
              {debtAmount > 0.01 && (
                <div className="card">
                  <div style={{ marginBottom: '12px' }}>
                    <div style={{ fontSize: '13px', color: '#666', marginBottom: '4px' }}>Amount owed</div>
                    <div style={{ fontSize: '18px', fontWeight: '500' }}>${debtAmount.toFixed(2)}</div>
                    <div style={{ fontSize: '12px', color: '#666' }}>{debtorName} → {debtorName === parent1Name ? parent2Name : parent1Name}</div>
                  </div>
                  <a href={`https://www.paypal.com/paypalme/${debtorName === parent1Name ? parent2Name.replace(/\s+/g, '').toLowerCase() : parent1Name.replace(/\s+/g, '').toLowerCase()}/${debtAmount.toFixed(2)}`} target="_blank" rel="noopener noreferrer" style={{ display: 'block', padding: '10px', background: '#0070ba', color: 'white', border: 'none', borderRadius: '8px', fontSize: '12px', fontWeight: '500', cursor: 'pointer', textAlign: 'center', textDecoration: 'none', marginBottom: '8px' }}>Pay with PayPal.Me</a>
                  <button className="success" onClick={() => recordPayment()} style={{ width: '100%' }}>Mark payment as complete</button>
                </div>
              )}

              <h3>Payment history</h3>
              {payments.length === 0 ? (
                <p style={{ color: '#999' }}>No payments recorded</p>
              ) : (
                payments.map(p => (
                  <div key={p.id} className="expense-item">
                    <div className="expense-content">
                      <div className="expense-title">{p.from} → {p.to}</div>
                      <div className="expense-desc">${p.amount.toFixed(2)}</div>
                      <div className="expense-date">{new Date(p.createdAt).toLocaleDateString()}</div>
                    </div>
                    <div style={{ padding: '4px 8px', background: p.status === 'completed' ? '#a5d5a5' : '#fff3cd', color: p.status === 'completed' ? '#004d00' : '#856404', borderRadius: '6px', fontSize: '10px', fontWeight: '500' }}>
                      {p.status === 'completed' ? '✓ Paid' : 'Pending'}
                    </div>
                  </div>
                ))
              )}
            </>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
